<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>rrcad preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0c10; overflow: hidden; }
    /* Cinematic vignette — darkens corners independently of the 3D scene. */
    #vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 48%,
        transparent 50%, rgba(0,0,0,0.60) 100%);
      pointer-events: none;
    }
    #status {
      position: fixed; top: 8px; left: 8px;
      color: #4b5563; font: 12px/1.5 monospace;
      pointer-events: none;
    }
    #properties {
      position: fixed; top: 34px; left: 8px;
      width: min(260px, calc(100vw - 16px));
      padding: 8px 10px;
      background: rgba(10,12,18,0.82);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      color: #9ca3af;
      font: 11px/1.45 monospace;
      backdrop-filter: blur(10px);
      pointer-events: none;
      z-index: 10;
    }
    .prop-title {
      color: #e5e7eb;
      font-size: 11px;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .prop-row {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 8px;
      min-height: 16px;
    }
    .prop-row span:first-child { color: #4b5563; }
    .prop-row span:last-child {
      color: #d1d5db;
      overflow-wrap: anywhere;
      text-align: right;
    }
    .prop-row.dim span:last-child {
      color: #9ca3af;
    }
    .prop-row.error span:last-child {
      color: #fca5a5;
    }
    #logo {
      position: fixed; bottom: 16px; right: 16px;
      height: 36px; width: auto;
      opacity: 0.55;
      pointer-events: none;
    }

    /* ── Hamburger menu ──────────────────────────────────────────────────── */
    #menu-btn {
      position: fixed; top: 8px; right: 8px;
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 4px;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
      z-index: 20;
      transition: background 0.15s;
    }
    #menu-btn:hover { background: rgba(255,255,255,0.10); }
    #menu-btn span {
      display: block;
      width: 13px; height: 1.5px;
      background: #6b7280;
      border-radius: 1px;
      transition: background 0.15s;
    }
    #menu-btn:hover span,
    #menu-btn.open  span { background: #d1d5db; }

    #menu-panel {
      position: fixed; top: 44px; right: 8px;
      background: rgba(10,12,18,0.92);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 6px;
      padding: 5px 0;
      min-width: 158px;
      font: 12px/1.5 monospace;
      color: #9ca3af;
      backdrop-filter: blur(10px);
      z-index: 20;
      display: none;
    }
    #menu-panel.open { display: block; }

    .menu-section + .menu-section {
      border-top: 1px solid rgba(255,255,255,0.06);
      margin-top: 3px;
      padding-top: 3px;
    }
    .menu-label {
      padding: 2px 11px 3px;
      font-size: 10px;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .menu-item {
      display: flex; align-items: center;
      padding: 4px 11px;
      cursor: pointer;
      gap: 8px;
      transition: color 0.1s;
    }
    .menu-item:hover  { color: #e5e7eb; }
    .menu-item.active { color: #f9fafb; }
    /* Radio dot */
    .menu-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      flex-shrink: 0;
    }
    .menu-item.active .menu-dot { background: currentColor; }
    /* Checkbox */
    .menu-check {
      width: 9px; height: 9px;
      border: 1.5px solid currentColor;
      border-radius: 2px;
      flex-shrink: 0;
      position: relative;
    }
    .menu-item.active .menu-check::after {
      content: '';
      position: absolute; inset: 1.5px;
      background: currentColor;
      border-radius: 1px;
    }
    .menu-shortcut {
      margin-left: auto;
      color: #374151;
    }
    .menu-item:hover .menu-shortcut { color: #6b7280; }
    .menu-slider {
      display: flex; align-items: center;
      gap: 8px;
      padding: 4px 11px 6px;
    }
    .menu-slider input {
      width: 100%;
      accent-color: #9ca3af;
      cursor: pointer;
    }
    .menu-slider-value {
      width: 36px;
      color: #6b7280;
      text-align: right;
      flex-shrink: 0;
    }

    /* White scene overrides — keep UI readable on a bright background. */
    body.scene-white #status { color: #9ca3af; }
    body.scene-white #menu-btn {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.12);
    }
    body.scene-white #menu-btn span { background: #9ca3af; }
    body.scene-white #menu-btn:hover span,
    body.scene-white #menu-btn.open  span { background: #374151; }
    body.scene-white #properties {
      background: rgba(255,255,255,0.82);
      border-color: rgba(0,0,0,0.10);
      color: #4b5563;
    }
    body.scene-white .prop-title,
    body.scene-white .prop-row span:last-child { color: #111827; }
    body.scene-white .prop-row span:first-child { color: #6b7280; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script>
  // CDN failure fallback: Three.js is imported from jsdelivr by the module
  // script below.  If the import fails (offline / blocked CDN) the module
  // never runs, leaving the page stuck on "connecting…" with only a console
  // error.  The module sets window.__rrcadViewerStarted once its imports
  // resolve; if that has not happened shortly after load — or a script error
  // fires first — surface a clear message in the status line.
  (function () {
    function cdnFailed() {
      if (window.__rrcadViewerStarted) return;
      window.__rrcadViewerStarted = true;  // report only once
      document.getElementById('status').textContent =
        'rrcad preview — failed to load Three.js from CDN — internet connection required';
    }
    window.addEventListener('error', e => {
      // Module import failures surface as uncaught errors with no viewer init.
      if (!window.__rrcadViewerStarted) cdnFailed();
    }, true);
    setTimeout(cdnFailed, 5000);
  })();
  </script>
</head>
<body>
<div id="vignette"></div>
<div id="status">rrcad preview — connecting…</div>
<div id="properties" aria-live="polite">
  <div class="prop-title">Model</div>
  <div class="prop-row"><span>Type</span><span id="prop-type">waiting</span></div>
  <div class="prop-row"><span>Valid</span><span id="prop-valid">waiting</span></div>
  <div class="prop-row"><span>Size</span><span id="prop-size">waiting</span></div>
  <div class="prop-row"><span>Volume</span><span id="prop-volume">waiting</span></div>
  <div class="prop-row"><span>Area</span><span id="prop-area">waiting</span></div>
  <div class="prop-row"><span>Distance</span><span id="prop-distance">off</span></div>
  <div class="prop-row dim"><span>Hover</span><span id="prop-hover">off</span></div>
  <div class="prop-row dim"><span>Selector</span><span id="prop-selector">off</span></div>
  <div class="prop-row dim"><span>Issue</span><span id="prop-issue">ok</span></div>
</div>
<img id="logo" src="/logo.png" alt="rrcad">

<button id="menu-btn" aria-label="View menu">
  <span></span><span></span><span></span>
</button>
<div id="menu-panel">
  <div class="menu-section">
    <div class="menu-label">View</div>
    <div class="menu-item" id="mi-normal">
      <div class="menu-dot"></div>Normal<span class="menu-shortcut">F</span>
    </div>
    <div class="menu-item" id="mi-flatline">
      <div class="menu-dot"></div>Flat-line<span class="menu-shortcut">F</span>
    </div>
  </div>
  <div class="menu-section">
    <div class="menu-label">Scene</div>
    <div class="menu-item" id="mi-showroom">
      <div class="menu-dot"></div>Showroom
    </div>
    <div class="menu-item" id="mi-white">
      <div class="menu-dot"></div>White
    </div>
  </div>
  <div class="menu-section">
    <div class="menu-label">Show</div>
    <div class="menu-item" id="mi-axes">
      <div class="menu-check"></div>Axes<span class="menu-shortcut">A</span>
    </div>
    <div class="menu-item" id="mi-measure">
      <div class="menu-check"></div>Measure<span class="menu-shortcut">M</span>
    </div>
    <div class="menu-item" id="mi-explode">
      <div class="menu-check"></div>Explode
    </div>
  </div>
  <div class="menu-section">
    <div class="menu-label">Section</div>
    <div class="menu-item" id="mi-section-off">
      <div class="menu-dot"></div>Off
    </div>
    <div class="menu-item" id="mi-section-x">
      <div class="menu-dot"></div>X plane
    </div>
    <div class="menu-item" id="mi-section-y">
      <div class="menu-dot"></div>Y plane
    </div>
    <div class="menu-item" id="mi-section-z">
      <div class="menu-dot"></div>Z plane
    </div>
    <div class="menu-slider">
      <input id="section-offset" type="range" min="-100" max="100" value="0" aria-label="Section offset">
      <span class="menu-slider-value" id="section-offset-value">0%</span>
    </div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader }      from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Imports resolved — tell the CDN-failure fallback in <head> not to fire.
window.__rrcadViewerStarted = true;

// ── Renderer ──────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled   = true;
renderer.shadowMap.type      = THREE.PCFSoftShadowMap;
renderer.outputColorSpace    = THREE.SRGBColorSpace;
renderer.toneMapping         = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.localClippingEnabled = true;
document.body.prepend(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();

// Gradient background: vertical sweep from deep near-black at the top down to
// a very faintly warm lift at the bottom — mimics the seamless paper sweep
// used in professional product photography studios.
// bgTex is declared at module scope so applySceneMode() can restore it.
const bgTex = (() => {
  const canvas = document.createElement('canvas');
  canvas.width = 2; canvas.height = 512;
  const ctx  = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.0, '#090b0f');  // top    — deep cool shadow
  grad.addColorStop(0.5, '#10131a');  // middle — slight blue-grey
  grad.addColorStop(1.0, '#1c1f2a');  // bottom — very subtle warm lift
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 2, 512);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
})();
scene.background = bgTex;

// PBR ambient environment: IBL reflections on surfaces (quieter than default
// so the explicit studio lights dominate and give directional character).
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment          = pmrem.fromScene(new RoomEnvironment()).texture;
scene.environmentIntensity = 0.55;
pmrem.dispose();

// ── Studio floor ───────────────────────────────────────────────────────────
// Large circle acting as the studio floor / sweep.  Dark polished concrete:
// low roughness gives a faint mirror-like reflection of the model, exactly
// like the lacquered table surface used in high-end product shoots.
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(2000, 64),
  new THREE.MeshStandardMaterial({
    color:     0x10121a,
    roughness: 0.30,
    metalness: 0.10,
  })
);
floor.rotation.x  = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ── Lights ────────────────────────────────────────────────────────────────

// Hemisphere: soft sky / ground ambient bounce — keeps the dark side of the
// model from going pure black, just like a reflective studio environment.
const hemi = new THREE.HemisphereLight(0xc8d8ff, 0x221a10, 0.55);
scene.add(hemi);

// Key (main softbox): large virtual light from upper-left-front.
// Casts soft shadows onto the studio floor.
const key = new THREE.DirectionalLight(0xfff8f2, 2.4);
key.position.set(2, 9, 5);
key.castShadow               = true;
key.shadow.mapSize.setScalar(2048);
key.shadow.camera.near       = 0.5;
key.shadow.camera.far        = 2000;
key.shadow.bias              = -0.0005;
scene.add(key);

// Fill: cool blue-white from lower-right — lifts the shadow side without
// washing out the key-to-fill contrast.
const fill = new THREE.DirectionalLight(0xa8c4ff, 0.55);
fill.position.set(-5, 1, -2);
scene.add(fill);

// Rim (separation light): warm backlight from behind-top, creates a bright
// outline halo that separates the model from the dark background — the
// "hair light" of product photography.
const rim = new THREE.DirectionalLight(0xffe8c0, 1.2);
rim.position.set(-1, 7, -9);
scene.add(rim);

// Ground bounce: very faint warm fill from below, simulating light reflected
// back up off the studio floor onto the underside of the model.
const bounce = new THREE.DirectionalLight(0xff8844, 0.12);
bounce.position.set(0, -4, 3);
scene.add(bounce);

// ── Camera ────────────────────────────────────────────────────────────────
// 40° FOV gives a slightly telephoto look — less perspective distortion than
// the default 45°, which is characteristic of product photography lenses.
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100000);
camera.position.set(80, 60, 120);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping  = true;
controls.dampingFactor  = 0.07;
// Clamp vertical orbit so the user cannot go below the studio floor.
controls.maxPolarAngle  = Math.PI * 0.48;

// ── Helpers ───────────────────────────────────────────────────────────────
// A subtle axes helper (press 'A' to toggle) — hidden by default in studio mode.
const axes = new THREE.AxesHelper(30);
axes.visible = false;
scene.add(axes);

const measureGroup = new THREE.Group();
scene.add(measureGroup);
const measureMarkerMaterial = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
const measureLineMaterial = new THREE.LineBasicMaterial({ color: 0x38bdf8 });

// View mode — persists across model reloads.
// 'normal' | 'flatline'
let viewMode = 'normal';

// ABS plastic material — defined here so applyViewMode can restore it.
const plastic = new THREE.MeshPhysicalMaterial({
  color:              0x2b2d30,  // dark charcoal
  roughness:          0.42,      // smooth but not mirror-like
  metalness:          0.00,      // pure plastic
  clearcoat:          0.50,      // thin glossy coat (mould sheen)
  clearcoatRoughness: 0.20,
  reflectivity:       0.35,
  side:               THREE.DoubleSide,
});

// Flat-shaded material used in flat-line mode — white, no PBR gloss.
const flatMaterial = new THREE.MeshLambertMaterial({
  color:       0xffffff,
  flatShading: true,
  side:        THREE.DoubleSide,
});

// Shared edge-line material — one instance reused across all meshes so toggling
// flat-line mode does not allocate a new LineBasicMaterial per mesh per enable.
const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x555555 });

// All materials the model can render with.  Section clipping is applied to
// these (per-material, localClippingEnabled) rather than the global
// renderer.clippingPlanes so the studio floor, axes helper, and measure
// markers stay unclipped.
const modelMaterials = [plastic, flatMaterial, edgeMaterial];

function setModelClippingPlanes(planes) {
  for (const material of modelMaterials) {
    material.clippingPlanes = planes;
    material.needsUpdate = true;  // toggling clipping requires a shader rebuild
  }
}

// Apply (or clear) edge-line helpers attached to each mesh as children.
function setEdgeLines(model, enabled) {
  if (!model) return;
  model.traverse(node => {
    if (!node.isMesh) return;
    if (enabled) {
      // Only add once — guard against double application.
      if (node.getObjectByName('__edgeLines')) return;
      // 15° crease angle: shows sharp CAD edges, omits micro-facet triangulation noise.
      const lines = new THREE.LineSegments(
        new THREE.EdgesGeometry(node.geometry, 15),
        edgeMaterial,  // shared — do NOT dispose on removal
      );
      lines.name = '__edgeLines';
      node.add(lines);
    } else {
      const lines = node.getObjectByName('__edgeLines');
      if (lines) {
        lines.geometry.dispose();  // per-mesh EdgesGeometry — free GPU memory
        node.remove(lines);
      }
    }
  });
}

function applyViewMode(model) {
  if (!model) return;
  const fl = (viewMode === 'flatline');
  model.traverse(node => {
    if (!node.isMesh) return;
    node.material = fl ? flatMaterial : plastic;
  });
  setEdgeLines(model, fl);
}

function captureExplodeBaseline(model) {
  if (!model) return;
  model.traverse(node => {
    if (node === model) return;
    if (node.parent === model) {
      node.userData.__explodeBase = node.position.clone();
    }
  });
}

function applyExplodeMode(model) {
  if (!model) return;
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const span = Math.max(box.getSize(new THREE.Vector3()).length() * 0.14, 1);
  model.traverse(node => {
    if (node === model || node.parent !== model) return;
    const base = node.userData.__explodeBase;
    if (!base) return;
    if (!exploded) {
      node.position.copy(base);
      return;
    }
    const nodeBox = new THREE.Box3().setFromObject(node);
    const direction = nodeBox.getCenter(new THREE.Vector3()).sub(center);
    if (direction.lengthSq() < 1e-8) direction.set(1, 0, 0);
    node.position.copy(base.clone().add(direction.normalize().multiplyScalar(span)));
  });
  model.updateMatrixWorld(true);
}

function statusText() {
  if (measureMode) return 'rrcad preview — measure';
  return viewMode === 'flatline' ? 'rrcad preview — flat-line'
                                 : 'rrcad preview — live';
}

// ── Scene mode ────────────────────────────────────────────────────────────
// 'showroom' — dark studio  |  'white' — pure white inspection scene
let sceneMode = 'showroom';
const vignette = document.getElementById('vignette');

function applySceneMode() {
  if (sceneMode === 'white') {
    scene.background       = new THREE.Color(0xffffff);
    scene.environmentIntensity = 0.25;
    floor.material.color.set(0xffffff);
    floor.material.roughness = 0.90;
    floor.material.metalness = 0.00;
    // Neutral bright lighting: flat hemisphere + soft overhead key only.
    hemi.color.set(0xffffff); hemi.groundColor.set(0xffffff); hemi.intensity = 2.0;
    key.color.set(0xffffff);  key.intensity  = 1.0;
    fill.intensity   = 0.6;
    rim.intensity    = 0.0;
    bounce.intensity = 0.0;
    vignette.style.display = 'none';
    document.body.classList.add('scene-white');
  } else {
    scene.background       = bgTex;
    scene.environmentIntensity = 0.55;
    floor.material.color.set(0x10121a);
    floor.material.roughness = 0.30;
    floor.material.metalness = 0.10;
    // Restore original showroom lights.
    hemi.color.set(0xc8d8ff); hemi.groundColor.set(0x221a10); hemi.intensity = 0.55;
    key.color.set(0xfff8f2);  key.intensity  = 2.4;
    fill.intensity   = 0.55;
    rim.intensity    = 1.2;
    bounce.intensity = 0.12;
    vignette.style.display = '';
    document.body.classList.remove('scene-white');
  }
  floor.material.needsUpdate = true;
}

// ── Menu ─────────────────────────────────────────────────────────────────
const menuBtn   = document.getElementById('menu-btn');
const menuPanel = document.getElementById('menu-panel');
const sectionOffsetInput = document.getElementById('section-offset');
const sectionOffsetValue = document.getElementById('section-offset-value');
const sectionPlane = new THREE.Plane();
let sectionAxis = 'off';
let sectionOffset = 0;
let measureMode = false;

function sectionNormal(axis) {
  if (axis === 'x') return new THREE.Vector3(1, 0, 0);
  if (axis === 'y') return new THREE.Vector3(0, 1, 0);
  return new THREE.Vector3(0, 0, 1);
}

function updateSectionPlane() {
  if (sectionAxis === 'off' || !currentModel) {
    setModelClippingPlanes(null);  // restore unclipped rendering
    return;
  }

  const box = new THREE.Box3().setFromObject(currentModel);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const normal = sectionNormal(sectionAxis);
  const span = Math.max(size[sectionAxis] / 2, 1);
  const point = center.clone().add(normal.clone().multiplyScalar(sectionOffset * span));
  sectionPlane.normal.copy(normal);
  sectionPlane.constant = -point.dot(normal);
  setModelClippingPlanes([sectionPlane]);
}

function setSectionAxis(axis) {
  sectionAxis = axis;
  updateSectionPlane();
  syncMenu();
}

function syncMenu() {
  const normalActive   = (viewMode === 'normal');
  const flatlineActive = (viewMode === 'flatline');
  document.getElementById('mi-normal')  .classList.toggle('active', normalActive);
  document.getElementById('mi-flatline').classList.toggle('active', flatlineActive);
  document.getElementById('mi-showroom').classList.toggle('active', sceneMode === 'showroom');
  document.getElementById('mi-white')   .classList.toggle('active', sceneMode === 'white');
  document.getElementById('mi-axes')    .classList.toggle('active', axes.visible);
  document.getElementById('mi-measure') .classList.toggle('active', measureMode);
  document.getElementById('mi-explode') .classList.toggle('active', exploded);
  document.getElementById('mi-section-off').classList.toggle('active', sectionAxis === 'off');
  document.getElementById('mi-section-x')  .classList.toggle('active', sectionAxis === 'x');
  document.getElementById('mi-section-y')  .classList.toggle('active', sectionAxis === 'y');
  document.getElementById('mi-section-z')  .classList.toggle('active', sectionAxis === 'z');
  sectionOffsetInput.disabled = sectionAxis === 'off';
  sectionOffsetValue.textContent = Math.round(sectionOffset * 100) + '%';
  // Show the F shortcut only on the *inactive* view item — the active one is already
  // visually selected, and showing F on both is ambiguous.
  const normalShortcut   = document.querySelector('#mi-normal .menu-shortcut');
  const flatlineShortcut = document.querySelector('#mi-flatline .menu-shortcut');
  if (normalShortcut)   normalShortcut.style.display   = flatlineActive ? '' : 'none';
  if (flatlineShortcut) flatlineShortcut.style.display = normalActive   ? '' : 'none';
}

menuBtn.addEventListener('click', e => {
  e.stopPropagation();
  const open = menuPanel.classList.toggle('open');
  menuBtn.classList.toggle('open', open);
  if (open) syncMenu();
});

// Close when clicking outside the panel.
document.addEventListener('click', () => {
  menuPanel.classList.remove('open');
  menuBtn.classList.remove('open');
});
menuPanel.addEventListener('click', e => e.stopPropagation());

document.getElementById('mi-normal').addEventListener('click', () => {
  viewMode = 'normal';
  applyViewMode(currentModel);
  status.textContent = statusText();
  syncMenu();
});
document.getElementById('mi-flatline').addEventListener('click', () => {
  viewMode = 'flatline';
  applyViewMode(currentModel);
  status.textContent = statusText();
  syncMenu();
});
document.getElementById('mi-showroom').addEventListener('click', () => {
  sceneMode = 'showroom';
  applySceneMode();
  syncMenu();
});
document.getElementById('mi-white').addEventListener('click', () => {
  sceneMode = 'white';
  applySceneMode();
  syncMenu();
});
document.getElementById('mi-axes').addEventListener('click', () => {
  axes.visible = !axes.visible;
  syncMenu();
});
document.getElementById('mi-measure').addEventListener('click', () => {
  setMeasureMode(!measureMode);
});
document.getElementById('mi-explode').addEventListener('click', () => {
  exploded = !exploded;
  applyExplodeMode(currentModel);
  syncMenu();
});
document.getElementById('mi-section-off').addEventListener('click', () => setSectionAxis('off'));
document.getElementById('mi-section-x')  .addEventListener('click', () => setSectionAxis('x'));
document.getElementById('mi-section-y')  .addEventListener('click', () => setSectionAxis('y'));
document.getElementById('mi-section-z')  .addEventListener('click', () => setSectionAxis('z'));
sectionOffsetInput.addEventListener('input', () => {
  sectionOffset = Number(sectionOffsetInput.value) / 100;
  updateSectionPlane();
  syncMenu();
});

// ── GLTF loader ───────────────────────────────────────────────────────────
let currentModel = null;
let loadGeneration = 0;
const loader = new GLTFLoader();
const status = document.getElementById('status');
const propType = document.getElementById('prop-type');
const propValid = document.getElementById('prop-valid');
const propSize = document.getElementById('prop-size');
const propVolume = document.getElementById('prop-volume');
const propArea = document.getElementById('prop-area');
const propDistance = document.getElementById('prop-distance');
const propHover = document.getElementById('prop-hover');
const propSelector = document.getElementById('prop-selector');
const propIssue = document.getElementById('prop-issue');

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const measurePoints = [];
let pointerDown = null;
let exploded = false;
let inspectionData = {
  named_refs: [],
  error: null,
  bounding_box: null,
};
let selectedInspection = null;

function measurementText() {
  if (measurePoints.length === 0) return measureMode ? 'pick first point' : 'off';
  if (measurePoints.length === 1) return 'pick second point';
  return formatNumber(measurePoints[0].distanceTo(measurePoints[1])) + ' mm';
}

function setMeasureMode(enabled) {
  measureMode = enabled;
  // Orbit controls stay enabled: the pointerup handler distinguishes clicks
  // from drags, so users can rotate the model between measurement picks.
  propDistance.textContent = measurementText();
  status.textContent = statusText();
  syncMenu();
}

function clearMeasurement() {
  measurePoints.length = 0;
  while (measureGroup.children.length > 0) {
    const child = measureGroup.children.pop();
    if (child.geometry) child.geometry.dispose();
  }
  propDistance.textContent = measurementText();
}

function clearInspectionSelection() {
  selectedInspection = null;
  propSelector.textContent = 'off';
}

function markerRadius() {
  if (!currentModel) return 1;
  const size = new THREE.Box3().setFromObject(currentModel).getSize(new THREE.Vector3());
  return Math.max(size.x, size.y, size.z) * 0.012 || 1;
}

function addMeasurePoint(point) {
  if (measurePoints.length >= 2) clearMeasurement();
  measurePoints.push(point.clone());

  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(markerRadius(), 16, 8),
    measureMarkerMaterial,
  );
  marker.position.copy(point);
  measureGroup.add(marker);

  if (measurePoints.length === 2) {
    const geometry = new THREE.BufferGeometry().setFromPoints(measurePoints);
    measureGroup.add(new THREE.Line(geometry, measureLineMaterial));
  }
  propDistance.textContent = measurementText();
}

function currentModelSize() {
  if (!currentModel) return 1;
  const box = new THREE.Box3().setFromObject(currentModel);
  const size = box.getSize(new THREE.Vector3());
  return Math.max(size.x, size.y, size.z) || 1;
}

function inspectionPointDistance(ref, point) {
  if (!ref || !Array.isArray(ref.centroid) || ref.centroid.length < 3) return Number.POSITIVE_INFINITY;
  const centroid = new THREE.Vector3(ref.centroid[0], ref.centroid[1], ref.centroid[2]);
  return centroid.distanceTo(point);
}

function inspectionNormalScore(ref, normal) {
  if (!ref || !Array.isArray(ref.normal) || ref.normal.length < 3 || !normal) return 0;
  const n = new THREE.Vector3(ref.normal[0], ref.normal[1], ref.normal[2]).normalize();
  return (1 - Math.abs(n.dot(normal.clone().normalize()))) * currentModelSize();
}

function pickNamedRef(kind, point, normal) {
  const refs = inspectionData.named_refs || [];
  let best = null;
  let bestScore = Number.POSITIVE_INFINITY;
  for (const ref of refs) {
    if (kind && ref.kind !== kind) continue;
    const score = inspectionPointDistance(ref, point) + inspectionNormalScore(ref, normal);
    if (score < bestScore) {
      bestScore = score;
      best = ref;
    }
  }
  if (!best) return null;
  const size = currentModelSize();
  const threshold = size * 0.65;
  return bestScore <= threshold ? best : null;
}

function inspectionSelectorForHit(hit, ref) {
  if (ref) return ref.selector;
  if (hit?.object?.name && hit.object.name !== '__edgeLines') return hit.object.name;
  const kind = hit?.object?.isLineSegments ? 'edge' : 'face';
  const id = hit?.object?.id ?? 'unknown';
  return `${kind}#${id}`;
}

function inspectionLabelForHit(hit, ref) {
  if (ref) return `${ref.kind} ${ref.name}`;
  if (hit?.object?.name && hit.object.name !== '__edgeLines') return hit.object.name;
  return hit?.object?.isLineSegments ? 'edge' : 'face';
}

function raycastInspection(event) {
  if (!currentModel) return null;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(currentModel, true)
    .filter(hit => hit.object && hit.object.visible !== false);
  if (hits.length === 0) return null;
  const hit = hits[0];
  const kind = hit.object.isLineSegments ? 'edge' : 'face';
  const normal = hit.face ? hit.face.normal.clone().applyNormalMatrix(
    new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld)
  ) : null;
  const ref = pickNamedRef(kind, hit.point, normal);
  return {
    kind,
    hit,
    ref,
    label: inspectionLabelForHit(hit, ref),
    selector: inspectionSelectorForHit(hit, ref),
  };
}

function updateHoverInspection(inspection) {
  if (!inspection) {
    propHover.textContent = 'off';
    if (!selectedInspection) propSelector.textContent = 'off';
    return;
  }
  propHover.textContent = inspection.label;
  propSelector.textContent = selectedInspection ? selectedInspection.selector : inspection.selector;
}

function commitInspectionSelection(inspection) {
  if (!inspection) return;
  selectedInspection = inspection;
  propSelector.textContent = inspection.selector;
  navigator.clipboard?.writeText(inspection.selector).catch(() => {});
}

function pickModelPoint(event) {
  if (!currentModel) return null;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(currentModel, true)
    .filter(hit => hit.object.isMesh && hit.object.name !== '__edgeLines');
  return hits.length > 0 ? hits[0].point : null;
}

renderer.domElement.addEventListener('pointerdown', event => {
  if (event.button !== 0) return;
  pointerDown = { x: event.clientX, y: event.clientY };
});

renderer.domElement.addEventListener('pointermove', event => {
  if (!currentModel || event.buttons !== 0) return;
  updateHoverInspection(raycastInspection(event));
});
renderer.domElement.addEventListener('pointerleave', () => updateHoverInspection(null));

renderer.domElement.addEventListener('pointerup', event => {
  if (event.button !== 0 || !pointerDown) return;
  const moved = Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y);
  pointerDown = null;
  if (moved > 4) return;
  if (measureMode) {
    const point = pickModelPoint(event);
    if (point) addMeasurePoint(point);
    return;
  }
  const inspection = raycastInspection(event);
  if (!inspection) return;
  updateHoverInspection(inspection);
  commitInspectionSelection(inspection);
});

window.addEventListener('keydown', e => {
  // Ignore browser/OS shortcuts (Ctrl+F, Cmd+A, …) — only bare keys are viewer shortcuts.
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') {
    menuPanel.classList.remove('open');
    menuBtn.classList.remove('open');
    if (measureMode && measurePoints.length > 0) {
      clearMeasurement();
    } else if (measureMode) {
      setMeasureMode(false);
    }
  }
  if (e.key === 'a' || e.key === 'A') { axes.visible = !axes.visible; syncMenu(); }
  if (e.key === 'm' || e.key === 'M') setMeasureMode(!measureMode);
  if (e.key === 'f' || e.key === 'F') {
    viewMode = (viewMode === 'flatline') ? 'normal' : 'flatline';
    applyViewMode(currentModel);
    status.textContent = statusText();
    syncMenu();
  }
});

function formatNumber(value) {
  if (typeof value !== 'number' || !Number.isFinite(value)) return 'n/a';
  return value.toLocaleString(undefined, {
    maximumFractionDigits: Math.abs(value) >= 100 ? 1 : 3
  });
}

function queryValue(query) {
  if (!query) return 'n/a';
  if (query.ok === false) return 'error';
  return query.value;
}

function setPropertiesUnavailable(text) {
  propType.textContent = text;
  propValid.textContent = text;
  propSize.textContent = text;
  propVolume.textContent = text;
  propArea.textContent = text;
  propIssue.textContent = text;
  document.getElementById('prop-issue').parentElement.classList.remove('error');
  inspectionData = {
    named_refs: [],
    error: null,
    bounding_box: null,
  };
}

async function loadMetadata(loadToken) {
  try {
    const response = await fetch('/metadata.json?' + Date.now(), { cache: 'no-store' });
    if (loadToken !== loadGeneration) return;
    if (!response.ok) {
      setPropertiesUnavailable('n/a');
      return;
    }
    const metadata = await response.json();
    if (loadToken !== loadGeneration) return;
    const type = queryValue(metadata.shape_type);
    const validation = queryValue(metadata.validation);
    const size = metadata.bounding_box && metadata.bounding_box.size;

    propType.textContent = typeof type === 'string' ? type : 'n/a';
    propValid.textContent = validation === 'ok' ? 'ok' : String(validation || 'n/a');
    propSize.textContent = Array.isArray(size)
      ? size.map(formatNumber).join(' x ')
      : 'n/a';
    propVolume.textContent = formatNumber(queryValue(metadata.volume));
    propArea.textContent = formatNumber(queryValue(metadata.surface_area));
    inspectionData = {
      named_refs: Array.isArray(metadata.named_refs) ? metadata.named_refs : [],
      error: metadata.error || null,
      bounding_box: metadata.bounding_box || null,
    };
    propIssue.textContent = inspectionData.error ? String(inspectionData.error) : 'ok';
    document.getElementById('prop-issue').parentElement.classList.toggle('error', !!inspectionData.error);
  } catch (err) {
    if (loadToken !== loadGeneration) return;
    console.error('rrcad: metadata load error', err);
    setPropertiesUnavailable('error');
  }
}

// Resize the key-light's shadow camera to tightly wrap the loaded model
// so shadows are crisp rather than washed out by an over-large frustum.
function fitShadowCamera(box) {
  const size   = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const r      = Math.max(size.x, size.y, size.z) * 1.6;
  const cam    = key.shadow.camera;
  cam.left   = center.x - r;
  cam.right  = center.x + r;
  cam.top    = center.y + r;
  cam.bottom = center.y - r;
  cam.updateProjectionMatrix();
}

function fitCamera(object) {
  const box    = new THREE.Box3().setFromObject(object);
  const center = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  if (maxDim === 0) return;

  fitShadowCamera(box);

  const fov  = camera.fov * (Math.PI / 180);
  // Fit the bounding sphere into the FOV, then add a small margin (1.15×)
  // so the model fills the frame closely without clipping.
  const dist = (maxDim / 2) / Math.tan(fov / 2) * 1.15;

  controls.target.copy(center);
  controls.minDistance = 0;
  controls.maxDistance = Infinity;
  camera.position.copy(center).add(
    new THREE.Vector3(0.5, 0.35, 1.0).normalize().multiplyScalar(dist)
  );
  camera.near = dist / 1000;
  camera.far  = dist * 50;
  camera.updateProjectionMatrix();
  controls.update();
}

function loadModel() {
  const loadToken = ++loadGeneration;
  status.textContent = 'rrcad preview — loading…';
  loadMetadata(loadToken);
  // Cache-bust so the browser always fetches the freshly written GLB.
  loader.load('/model.glb?' + Date.now(),
    gltf => {
      if (loadToken !== loadGeneration) return;
      if (currentModel) {
        clearMeasurement();
        // Free GPU memory for the outgoing model.  Materials (plastic / flatMaterial /
        // edgeMaterial) are module-scoped shared instances and must NOT be disposed.
        // EdgesGeometry children are per-mesh and are disposed here via setEdgeLines.
        setEdgeLines(currentModel, false);  // dispose any attached EdgesGeometry
        currentModel.traverse(node => {
          if (node.isMesh) node.geometry.dispose();
        });
        scene.remove(currentModel);
      }
      currentModel = gltf.scene;
      captureExplodeBaseline(currentModel);

      // OCCT exports in Z-up; glTF/Three.js is Y-up.
      // Rotate -90° around X to convert: OCCT(X,Y,Z) → Three.js(X,Z,−Y).
      currentModel.rotation.x = -Math.PI / 2;
      currentModel.updateMatrixWorld(true);

      // Translate the model so its lowest point rests exactly on Y = 0
      // (the studio floor plane).  This makes the shadow land correctly.
      const box0 = new THREE.Box3().setFromObject(currentModel);
      currentModel.position.y -= box0.min.y;
      currentModel.updateMatrixWorld(true);

      // Apply the base plastic material and shadow settings to all meshes.
      // applyViewMode() will override material/edges to match the active view mode.
      currentModel.traverse(node => {
        if (node.isMesh) {
          node.material      = plastic;
          node.castShadow    = true;
          node.receiveShadow = true;
        }
      });

      scene.add(currentModel);
      currentModel.updateMatrixWorld(true);
      fitCamera(currentModel);
      applyViewMode(currentModel);
      applyExplodeMode(currentModel);
      updateSectionPlane();
      status.textContent = statusText();
      clearInspectionSelection();
      updateHoverInspection(null);
    },
    undefined,
    err => {
      if (loadToken !== loadGeneration) return;
      console.error('rrcad: GLB load error', err);
      // Surface the underlying message so users can self-diagnose; the OCCT
      // error (if any) is also printed to the rrcad terminal stderr.
      const detail = (err && (err.message || err.statusText)) || 'check terminal for OCCT error';
      status.textContent = 'rrcad preview — load error: ' + detail;
    }
  );
}

loadModel();

// ── WebSocket live-reload ─────────────────────────────────────────────────
// Exponential backoff on reconnect: 1 s → 2 s → 4 s → 8 s (capped).  After
// MAX_RECONNECT_ATTEMPTS the loop stops and the user is told the server is
// gone.  Without this the browser would pound a dead port every second
// forever once rrcad exits.
const MAX_RECONNECT_ATTEMPTS = 8;
let reconnectAttempt = 0;
function connectWS() {
  const ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onopen    = () => {
    // After a successful *re*connect the server was restarted and may hold new
    // geometry — reload immediately rather than waiting for the next file save.
    if (reconnectAttempt > 0) loadModel();
    reconnectAttempt = 0;          // reset backoff on successful connect
    status.textContent = statusText();
  };
  ws.onmessage = e  => { if (e.data === 'reload') loadModel(); };
  ws.onerror = e  => console.error('rrcad ws error', e);
  ws.onclose   = () => {
    if (reconnectAttempt >= MAX_RECONNECT_ATTEMPTS) {
      status.textContent = 'rrcad preview — server gone (reload page to retry)';
      return;
    }
    const delayMs = Math.min(1000 * Math.pow(2, reconnectAttempt), 8000);
    reconnectAttempt += 1;
    status.textContent = 'rrcad preview — reconnecting (attempt ' + reconnectAttempt + ')…';
    setTimeout(connectWS, delayMs);
  };
}
connectWS();

// ── Resize ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Render loop ───────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
